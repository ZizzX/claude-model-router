name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check all scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done
      - name: Validate hooks + plugin JSON
        run: node -e "['hooks/hooks.json','.claude-plugin/plugin.json','.claude-plugin/marketplace.json'].forEach(f=>JSON.parse(require('fs').readFileSync(f,'utf8')))"
      - name: Run classifier tests
        run: node --test
